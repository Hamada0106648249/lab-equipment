<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratory Equipment Register &middot; College of Pharmacy, Al-Maaqal University</title>
<style>
:root{--navy:#1F4E79;--navy-d:#17395a;--ink:#1F2A37;--muted:#6B7785;--line:#D7DEE6;
--chip:#EAF0F6;--bg:#F4F6F9;--ok:#1C7C54;--ok-bg:#E6F2EC}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--navy)}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 56px}
header.top{background:#fff;border-bottom:3px solid var(--navy);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 14px}
.top img{width:44px;height:40px;flex:0 0 auto}
.top h1{margin:0;font-size:15px;line-height:1.25;color:var(--navy);letter-spacing:.3px}
.top h1 span{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:16px;overflow:hidden}
.sec{background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:1.2px;
 padding:9px 14px;text-transform:uppercase}
.hero{display:flex;gap:16px;padding:16px;flex-wrap:wrap}
.hero img{width:190px;height:170px;object-fit:cover;border-radius:10px;border:1px solid var(--line);
 background:#fff;flex:0 0 auto}
.hero .meta{flex:1 1 260px;min-width:0}
.hero h2{margin:0 0 4px;font-size:22px;line-height:1.25;color:var(--ink)}
.hero .mdl{color:var(--muted);font-size:14px;margin-bottom:12px}
.asset{display:inline-block;background:var(--chip);border-radius:9px;padding:8px 12px;margin-bottom:10px}
.asset b{display:block;font-size:10.5px;letter-spacing:1px;color:var(--muted);font-weight:700}
.asset code{font:700 17px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--navy);
 letter-spacing:.5px;word-break:break-all}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;
 background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:#FBF0DC;color:#8A5B00}
dl{margin:0}
.row{display:flex;gap:12px;border-top:1px solid var(--line);padding:11px 14px}
.row dt{flex:0 0 38%;max-width:220px;font-weight:600;font-size:13.5px;color:var(--ink);margin:0}
.row dd{margin:0;flex:1;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.block{border-top:1px solid var(--line);padding:13px 14px}
.block h3{margin:0 0 5px;font-size:13.5px;color:var(--navy)}
.block p{margin:0;font-size:14.5px}
.ppe{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.ppe span{background:var(--chip);color:var(--navy);font-size:12.5px;font-weight:600;
 padding:4px 11px;border-radius:999px}
.back{display:inline-block;margin-top:16px;font-size:14px;text-decoration:none;font-weight:600}
.search{width:100%;padding:11px 13px;font-size:16px;border:1px solid var(--line);border-radius:10px;
 margin-top:16px;background:#fff;color:var(--ink)}
ul.list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
ul.list a{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);
 border-radius:11px;padding:10px;text-decoration:none;color:inherit;height:100%}
ul.list img{width:58px;height:54px;object-fit:cover;border-radius:7px;flex:0 0 auto;border:1px solid var(--line)}
ul.list .t{font-weight:600;font-size:14.5px;line-height:1.3}
ul.list .s{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;
 word-break:break-all;margin-top:2px}
.lead{margin:18px 0 0;color:var(--muted);font-size:14px}
footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
@media print{
 body{background:#fff}header.top{position:static}.search,.back,#index{display:none}
 .card{border:1px solid #999;break-inside:avoid}.sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="img/logo.png" alt="">
  <h1>College of Pharmacy &nbsp;|&nbsp; Al-Maaqal University
    <span>Laboratory Equipment Register</span></h1>
</div></header>
<main class="wrap" id="app"></main>
<script>
const DATA = [{"id": "EQ-001", "short": "Refrigerated Bath Circulator", "name": "Refrigerated Bath Circulator (Cooling Water Bath)", "model": "Thermomac / Labo SM-series refrigerated circulator", "serial": "TM-SM-2022-0147", "asset": "M2B1PHF1L3RBC0001", "lab": "Physical Pharmacy Lab", "installed": "15/03/2022", "warranty": "14/03/2024 (expired)", "status": "In service", "desc": "A stainless-steel bath fitted with an electric heater and a sealed compression refrigeration circuit, both regulated by a PID controller against a submerged probe. A built-in pump circulates the bath fluid inside the tank and, through the external ports and tubing, through jacketed glassware, so the fluid is held at a set temperature above or below ambient.", "use": "Temperature control of jacketed vessels, diffusion and dissolution cells, viscometers and reflux condensers; solubility, partitioning and stability work requiring a stable sub-ambient or elevated temperature.", "specs": "Working range approx. -10 to +100 °C; stability ±0.1 °C; bath volume approx. 6 L; circulation pump approx. 10 L/min; stainless-steel tank with lid; 230 V, 50 Hz, approx. 800 W.", "hazards": "Hot and cold fluid, hot external tubing and scalding risk; electrical equipment in contact with liquid; sealed refrigerant circuit under pressure (service by a technician only). Never operate with the tank below the minimum level. Do not use flammable bath fluids; use water or an approved heat-transfer fluid. Allow the bath to reach room temperature before draining.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-002", "short": "Automatic Water Still", "name": "Automatic Water Still (Laboratory Water Distillation Unit)", "model": "Hamilton Laboratory Glass Ltd / AquaMatic", "serial": "HLG-AQM-2022-0083", "asset": "M2B1PHF1L4WDS0002", "lab": "Pharmaceutical Chemistry Lab", "installed": "22/05/2022", "warranty": "21/05/2023 (expired)", "status": "In service", "desc": "Mains water feeds a borosilicate glass boiler where an immersed element brings it to the boil. The vapour passes into a water-cooled glass condenser, where it returns to the liquid state free of dissolved solids and most non-volatile contaminants, and drains into the collecting reservoir. A level sensor stops the cycle when the reservoir is full, and a separate boiler fill and cleanse circuit flushes accumulated scale.", "use": "Production of distilled water for buffer and reagent preparation, dissolution and disintegration media, glassware rinsing and microbiological media throughout the teaching laboratories.", "specs": "Output approx. 4 L/h; conductivity of product water typically below 2 µS/cm; borosilicate glass boiler and condenser; heater approx. 3 kW; reservoir-full indicator and fuse protection; requires continuous cooling-water supply and drain; 230 V, 50 Hz.", "hazards": "Boiling water, steam and hot glass surfaces; risk of glass breakage under thermal shock; electrical supply adjacent to running water. The unit must never be run without cooling water or with the boiler dry. Descale on the stated schedule, and isolate and allow to cool before any cleaning.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-003", "short": "Laboratory Incubator", "name": "Laboratory Incubator (Bacteriological Incubator, UV-equipped)", "model": "Thermomac digital incubator with light, fan and UV lamp", "serial": "TM-INC-2022-0216", "asset": "M2B1PHF1L5INC0003", "lab": "Pharmaceutical Microbiology Lab", "installed": "08/09/2022", "warranty": "07/09/2024 (expired)", "status": "In service", "desc": "An insulated double-walled chamber heated by resistance elements under digital PID control against a chamber probe. A circulation fan gives forced-air distribution so that temperature is uniform between shelves. An interior lamp allows inspection without opening the door, and a UV lamp is provided for surface decontamination of the empty chamber between runs.", "use": "Incubation of bacterial and fungal cultures at controlled temperature; sterility testing, microbial limit tests, preservative efficacy testing and antibiotic sensitivity practicals.", "specs": "Range ambient +5 to 65 °C; stability ±0.5 °C; chamber volume approx. 65 L; stainless-steel interior with adjustable perforated shelves; forced-air circulation; interior lamp and UV decontamination lamp; digital display and timer; 230 V, 50 Hz.", "hazards": "Ultraviolet radiation causes eye and skin injury; the UV lamp must only run with the door closed and the chamber empty of personnel-handled work, and must be switched off before the door is opened. Hot interior surfaces and shelves. Cultures inside are a biological hazard and must be handled, sealed and disposed of by the laboratory biosafety procedure. Flammable solvents must never be placed in the chamber.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-004", "short": "Laminar Airflow Cabinet", "name": "Vertical Laminar Airflow Cabinet (Clean Bench)", "model": "Bench-type vertical laminar flow cabinet, approx. 1.2 m (nameplate not legible in survey photograph; confirm)", "serial": "LAF-2023-0004 (provisional; confirm from nameplate)", "asset": "M2B1PHF1L5LAF0004", "lab": "Pharmaceutical Microbiology Lab", "installed": "19/02/2023", "warranty": "18/02/2024 (expired)", "status": "In service", "desc": "A blower draws room air through a pre-filter and delivers it through a HEPA filter mounted in the top housing. The filtered air descends over the work surface as a unidirectional stream at approximately 0.45 m/s and leaves through the perforated worktop, so that particles are swept away from the work and the work zone is kept at clean-room class. The cabinet protects the product only; it is not a biological safety cabinet and gives no operator protection.", "use": "Aseptic preparation and pouring of culture media, plating and subculturing, sterile filtration, aseptic compounding and sterile-product practicals.", "specs": "Work area approx. 1200 x 600 mm; HEPA filter H14, efficiency at least 99.99 % at 0.3 µm; downflow velocity approx. 0.45 m/s; ISO Class 5 work zone; fluorescent and UV lamps; two internal power sockets; stainless-steel work surface with perforated return; 230 V, 50 Hz.", "hazards": "No operator protection is provided: pathogenic organisms, cytotoxic material and volatile or toxic solvents must not be handled in this cabinet. Ultraviolet exposure injures eyes and skin, so the UV lamp runs only with the sash closed and the room unoccupied. Internal sockets sit close to liquids. Run the blower for the stated purge time before and after work, and have the HEPA filter integrity tested on schedule.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-005", "short": "Bench-top Incubator", "name": "Bench-top Incubator", "model": "Faithful Instrument, bench-top digital incubator with viewing window", "serial": "FTH-INC-2022-0311", "asset": "M2B1PHF1L5INC0005", "lab": "Pharmaceutical Microbiology Lab", "installed": "08/09/2022", "warranty": "07/09/2023 (expired)", "status": "In service", "desc": "A small natural-convection chamber with resistance elements in the double wall and a digital PID controller with timer. The inner glass door and outer door allow the contents to be inspected without disturbing the chamber temperature.", "use": "Incubation of small numbers of plates, tubes and sterility-test samples; low-temperature drying and conditioning of samples; routine teaching practicals alongside the main incubator.", "specs": "Range ambient +5 to 65 °C; stability ±0.5 °C; chamber volume approx. 30 L; two adjustable wire shelves; digital temperature display and timer; inner glass door; 230 V, 50 Hz, approx. 300 W.", "hazards": "Hot interior surfaces, shelves and inner glass door. Cultures inside are a biological hazard and must be sealed and disposed of by the laboratory biosafety procedure. Flammable or volatile solvents must never be placed in the chamber. Do not overload the shelves or block the air path.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-006", "short": "Electric Centrifuge", "name": "Bench-top Electric Centrifuge", "model": "Model 80-1 bench-top centrifuge", "serial": "C801-2022-0128", "asset": "M2B1PHF1L4CEN0006", "lab": "Pharmaceutical Chemistry Lab", "installed": "14/06/2022", "warranty": "13/06/2023 (expired)", "status": "In service", "desc": "An electric motor spins a fixed-angle rotor carrying the sample tubes. The centrifugal field drives the denser phase to the bottom of each tube, so that a suspended solid is sedimented or two immiscible liquids are separated. Run time is set on the mechanical timer and speed on the separate control.", "use": "Sedimentation of precipitates before filtration or assay, separation of serum and plasma in teaching practicals, clarification of plant and tablet extracts, and phase separation after liquid-liquid extraction.", "specs": "Capacity 6 x 20 mL tubes; maximum speed approx. 4000 rpm, giving a relative centrifugal field of approximately 1800 × g; timer 0 to 30 min; lid interlock; 230 V, 50 Hz.", "hazards": "An unbalanced rotor can cause severe mechanical failure: tubes must always be loaded in opposing pairs of equal mass. Never open the lid, or attempt to slow the rotor by hand, until it has stopped. Tube breakage releases the sample as an aerosol, so infectious or corrosive material requires sealed tubes. Keep the unit on a level, stable bench.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-007", "short": "Water Bath, four-place", "name": "Thermostatic Water Bath, four-place", "model": "Westtline, four-hole digital water bath", "serial": "WL-WB4-2022-0057", "asset": "M2B1PHF1L1THMD0001", "lab": "Pharmaceutics Lab", "installed": "10/04/2022", "warranty": "09/04/2024 (expired)", "status": "In service", "desc": "An electric element heats water held in a stainless-steel tank, and a digital controller with a submerged probe and over-temperature cut-out maintains the set point. Four openings fitted with concentric ring lids allow the aperture to be matched to the diameter of the flask or beaker, giving even heat transfer without a naked flame.", "use": "Gentle heating and evaporation of volatile liquids, dissolution of excipients and polymers, melting of suppository and ointment bases, warming of reagents, and temperature equilibration of samples before measurement.", "specs": "Four heating positions with concentric ring covers; range ambient +5 to 100 °C; stability ±0.5 °C; digital temperature and timer display with alarm; stainless-steel tank; 230 V, 50 Hz, approx. 1 kW.", "hazards": "Hot water, steam and hot ring covers cause scalding and burns; use tongs or a flask holder to lift hot vessels. The bath must never be switched on dry. Electrical supply sits beside standing water, so keep the exterior and controls dry. Change the water and descale regularly to limit microbial growth.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-008", "short": "Dissolution Test Apparatus", "name": "Dissolution Test Apparatus, six-vessel", "model": "Thermomac DT206D", "serial": "TM-DT206D-2023-0042", "asset": "M2B1PHF1L1DST0008", "lab": "Pharmaceutics Lab", "installed": "12/03/2023", "warranty": "11/03/2025 (expired)", "status": "In service", "desc": "Six round-bottomed vessels sit in a thermostatted water bath that holds the dissolution medium at 37 °C. A motor drives paddles or rotating baskets at a set speed, so the dosage form is exposed to a defined hydrodynamic environment. Medium is withdrawn at set intervals and assayed, giving the proportion of drug released against time. The unit covers pharmacopoeial Apparatus 1 (basket) and Apparatus 2 (paddle).", "use": "Dissolution profiles of tablets and capsules for quality-control release, formulation development and comparative or biowaiver studies; demonstration of dissolution testing in industrial pharmacy practicals.", "specs": "Six vessels of 1000 mL; paddle and basket assemblies; stirring speed 25 to 200 rpm, accuracy ±1 rpm; bath temperature 37 ±0.5 °C; independent digital timers; shaft centring and wobble within pharmacopoeial tolerance; 230 V, 50 Hz.", "hazards": "Rotating shafts present an entanglement hazard; tie back long hair and loose clothing and do not reach between the shafts while running. The bath water is hot. Vessels are glass and break if knocked. Dissolution media may contain acid, alkali or surfactant. Mechanical qualification (shaft centring, wobble, vibration and temperature) directly affects results and must be performed on schedule.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-009", "short": "Disintegration Test Apparatus", "name": "Disintegration Test Apparatus, two-basket", "model": "Thermomac ZT302", "serial": "TM-ZT302-2023-0039", "asset": "M2B1PHF1L1DTA0009", "lab": "Pharmaceutics Lab", "installed": "12/03/2023", "warranty": "11/03/2025 (expired)", "status": "In service", "desc": "Two basket-rack assemblies, each holding six open-ended tubes with a mesh base, are raised and lowered at a fixed rate and stroke in beakers of medium held at 37 °C by the surrounding water bath. The time taken for the dosage form to break down and pass through the mesh, leaving no palpable core, is recorded as the disintegration time.", "use": "Pharmacopoeial disintegration testing of uncoated, coated and effervescent tablets and of capsules, for quality control and for teaching the relationship between formulation, disintegration and dissolution.", "specs": "Two basket-rack assemblies of six tubes each; frequency 29 to 32 cycles per minute; stroke 53 to 57 mm; bath temperature 37 ±0.5 °C; two independent digital timers with end-of-test alarm; 230 V, 50 Hz.", "hazards": "The reciprocating basket assembly creates pinch points at the top and bottom of the stroke; keep hands clear while running. The bath water is hot and the glass tubes and beakers break if knocked. Fill the tank only to the marked level with the beakers out, as stated on the tank, or the heater can be damaged and water can overflow.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-010", "short": "Tablet Hardness Tester", "name": "Tablet Hardness Tester (Crushing Strength Tester)", "model": "Thermomac TBH40", "serial": "TM-TBH40-2023-0051", "asset": "M2B1PHF1L1THT0010", "lab": "Pharmaceutics Lab", "installed": "12/03/2023", "warranty": "11/03/2025 (expired)", "status": "In service", "desc": "The tablet is placed on its edge between a fixed anvil and a motor-driven jaw. The jaw advances at a constant rate until the tablet fractures, and a load cell records the force at the point of fracture, which is displayed as the crushing strength. The instrument stores a batch of results, calculates mean and standard deviation, and prints them on the integral printer.", "use": "Determination of crushing strength of tablets during formulation development, in-process control and finished-product quality control, and for correlating compression force with hardness, friability and disintegration time in practicals.", "specs": "Measuring range approximately 2 to 400 N; resolution 0.1 N; automatic batch statistics (mean, standard deviation, maximum and minimum); integral thermal printer; adjustable jaw for tablet diameter; 230 V, 50 Hz.", "hazards": "The advancing jaw is a crush and pinch point; keep fingers clear once the test is started. Tablets can fracture sharply and eject fragments towards the operator. Friable tablets release dust, which matters where the active is potent. Clean fragments and dust from the platform between tests so they do not bias the next reading.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-011", "short": "Single-Punch Tablet Press", "name": "Single-Punch Tablet Press (manual, hand-operated)", "model": "Bench-top single-station press, hand-lever type", "serial": "SPT-2022-0074", "asset": "M2B1PHF1L2TBP0011", "lab": "Pharmaceutical Technology Lab", "installed": "14/06/2022", "warranty": "13/06/2023 (expired)", "status": "In service", "desc": "Powder or granulate is delivered from the feed shoe into the die cavity, whose volume is set by the position of the lower punch. Turning the hand lever drives the upper punch down against the stationary lower punch, compressing the powder into a coherent compact. Continuing the stroke raises the lower punch, which ejects the tablet, and the shoe sweeps it clear and refills the die. Fill depth governs tablet weight and the depth of upper-punch penetration governs compression force.", "use": "Teaching the mechanics of tablet compression, preparation of small experimental batches during formulation development, and production of compacts for hardness, friability and disintegration testing.", "specs": "Single station, manual lever drive; maximum tablet diameter approximately 12 mm; maximum fill depth approximately 15 mm; interchangeable punch and die sets, flat and concave; output dependent on operator; no electrical supply required.", "hazards": "Severe crush and pinch injury is possible at the punch, die and lever linkage; never place fingers in the die area and never clear a jam while the lever is under load. The press must be bolted or clamped to the bench before use. Fine powders become airborne during filling and ejection, so potent or sensitising materials require local extraction. Isolate the punches and clean them between products to prevent cross-contamination.", "ppe": ["Lab coat", "Gloves", "Eye protection", "Dust mask"]}, {"id": "EQ-012", "short": "Ultrasonic Cleaning Bath", "name": "Ultrasonic Cleaning Bath", "model": "Alex Machine AXUY-12LAB", "serial": "AM-12LAB-2022-0096", "asset": "M2B1PHF1L1USC0012", "lab": "Pharmaceutics Lab", "installed": "20/07/2022", "warranty": "19/07/2023 (expired)", "status": "In service", "desc": "Piezoelectric transducers bonded to the underside of the stainless-steel tank vibrate at ultrasonic frequency, generating cavitation bubbles throughout the liquid. The collapse of these bubbles at a submerged surface dislodges adhering contaminants and drives dissolved gas out of solution. A thermostat-controlled heater warms the bath and a mechanical timer sets the cycle length.", "use": "Degassing and deaeration of dissolution media, cleaning of glassware, filters, punches and dies, dispersion of suspensions, and acceleration of dissolution when preparing samples and standards for assay.", "specs": "Stainless-steel tank of approximately 10 L with lid and drain; ultrasonic frequency approximately 40 kHz; ultrasonic power approximately 240 W; heater with thermostat to approximately 80 °C; mechanical timer 0 to 30 min; 230 V, 50 Hz.", "hazards": "The unit must never be run without liquid, as the transducers will be destroyed. Do not place hands in the tank during operation, since cavitation damages skin and the liquid may be hot. Flammable or chlorinated solvents must not be poured into the tank; place them in a beaker suspended in the water instead. The unit emits audible noise at the edge of the ultrasonic band during long cycles.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-013", "short": "Water Bath, 20 L", "name": "Thermostatic Water Bath, rectangular lidded", "model": "Bench-top digital water bath, approx. 20 L (nameplate not legible in survey photograph; confirm)", "serial": "WB20-2023-0115 (provisional; confirm from nameplate)", "asset": "M2B1PHF1L3WBT0013", "lab": "Physical Pharmacy Lab", "installed": "19/02/2023", "warranty": "18/02/2025 (expired)", "status": "In service", "desc": "A resistance heater in the base warms water in a stainless-steel tank, and a PID controller with a submerged probe, digital display and independent over-temperature cut-out holds the set point across the working volume. The gabled stainless lid returns condensate to the bath and limits evaporation and heat loss during long runs.", "use": "Controlled-temperature incubation of samples, pre-warming and equilibration of dissolution and diffusion media, melting of semisolid bases, and solubility, partitioning and accelerated-stability work requiring a stable bath over extended periods.", "specs": "Working volume approximately 20 L; range ambient +5 to 100 °C; stability ±0.2 °C; digital set point and display, timer and over-temperature protection; stainless-steel tank with gabled lid and drain tap; 230 V, 50 Hz, approx. 1.5 kW.", "hazards": "Hot water and the steam released when the lid is lifted cause scalding; lift the lid away from the face. The bath must never be switched on dry, and the over-temperature cut-out must not be bypassed. Keep the controls and the exterior dry. Change the water and descale on schedule, since standing warm water supports microbial growth.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-014", "short": "Visible Spectrophotometer", "name": "Visible Spectrophotometer", "model": "Rayleigh VIS-723G", "serial": "RL-723G-2023-0062", "asset": "M2B1PHF1L4SPV0014", "lab": "Pharmaceutical Chemistry Lab", "installed": "05/04/2023", "warranty": "04/04/2025 (expired)", "status": "In service", "desc": "A tungsten-halogen lamp provides a continuous visible spectrum, and a grating monochromator selects a narrow band at the chosen wavelength. The beam passes through the sample held in a cuvette and falls on a silicon photodiode. Absorbance is derived from the ratio of the transmitted intensity for the sample to that of the blank, and relates to concentration through the Beer-Lambert law. A four-position cell holder allows blank and samples to be measured in sequence.", "use": "Quantitative assay of drug substances and products in solution, analysis of dissolution samples, construction of calibration curves, content-uniformity determination and colorimetric assays in analytical and quality-control practicals.", "specs": "Wavelength range 320 to 1100 nm; spectral bandwidth 2 nm; wavelength accuracy ±1 nm; photometric range -0.3 to 3 A; stray light below 0.3 %T; measurement modes transmittance, absorbance, concentration and quantitative analysis; four-position cell holder; RS-232 output; 230 V, 50 Hz.", "hazards": "The lamp housing reaches a high temperature; isolate the instrument and allow it to cool before changing a lamp. Solvents, acids and alkalis spilled into the cell compartment damage optics and present a chemical hazard, so fill and wipe cuvettes outside the instrument. Do not place the instrument in direct sunlight or near a heat source, as this degrades photometric accuracy.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-015", "short": "Vortex Mixer", "name": "Vortex Mixer", "model": "Four E's Scientific MI0101002", "serial": "FES-MI01-2023-0127", "asset": "M2B1PHF1L4VTX0015", "lab": "Pharmaceutical Chemistry Laboratory", "installed": "05/04/2023", "warranty": "04/04/2024 (expired)", "status": "In service", "desc": "An electric motor drives an eccentric weight, so the rubber cup on top describes a small, rapid orbit. A tube pressed against the cup takes up that orbital motion and its contents swirl into a vortex, mixing within seconds. The unit runs continuously at a speed set on the dial, or only while a tube is pressed down, in touch mode.", "use": "Rapid mixing of reagents and samples in test tubes and small vials, resuspension of pellets after centrifugation, dissolution of solids when preparing standards and assay samples, and homogenisation of suspensions before measurement.", "specs": "Orbital diameter approximately 4 to 5 mm; variable speed to approximately 3000 rpm; continuous and touch operating modes; accepts tubes up to approximately 30 mm diameter; rubber cup head; non-slip feet; 230 V, 50 Hz, approximately 50 W.", "hazards": "An uncapped tube sprays its contents and generates aerosol, so cap every vessel before mixing and never vortex an open tube. Volatile solvents and pressurised or effervescent contents must not be mixed in this way. The unit walks across the bench if the feet are dirty or the head is run unloaded at high speed, so keep it clear of the bench edge. Keep fingers, hair and loose clothing away from the moving cup and switch off at the mains before changing the head.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-016", "short": "Melting Point Apparatus", "name": "Melting Point Apparatus", "model": "Coslab melting point apparatus (model not marked on the unit)", "serial": "CSL-MPA-2022-0064 (provisional; confirm from nameplate)", "asset": "M2B1PHF1L4MPA0016", "lab": "Pharmaceutical Chemistry Laboratory", "installed": "22/05/2022", "warranty": "21/05/2023 (expired)", "status": "In service", "desc": "A capillary tube holding a short packed column of dry sample is placed in the heated block beside the thermometer. The heater runs through a variable control graduated 0 to 100, so the rate of temperature rise can be set, and a separate switch selects a low or high heating range. An illuminated magnifier lets the operator watch the sample while reading the thermometer. The temperature at which the solid first collapses and the temperature at which it becomes wholly liquid define the melting range.", "use": "Identity and purity testing of drug substances and of compounds prepared in the laboratory, since an impure or damp sample melts lower and over a wider range; confirmation that a recrystallisation has worked; checking waxes, fats and suppository bases in formulation practicals.", "specs": "Working range ambient to approximately 250 °C, read on a calibrated thermometer; variable heater control graduated 0 to 100 for setting the rate of rise; selectable low and high heating ranges; illuminated viewing magnifier; takes two or three capillaries at a time; 230 V, 50 Hz.", "hazards": "The heating block and thermometer reach temperatures that burn on contact and stay hot long after the heater is switched off, so allow the unit to cool before handling. Capillary tubes are thin glass and snap easily; discard them in the sharps container and never reuse one. Approach the expected melting point slowly, because a fast rise gives a falsely high and falsely wide range. Samples must be dry, since residual solvent both depresses the melting point and may ignite on the hot block.", "ppe": ["Lab coat", "Gloves", "Eye protection"]}, {"id": "EQ-017", "short": "Motorised Treadmill", "name": "Motorised Treadmill (Exercise Physiology)", "model": "Reebok motorised treadmill (model not marked in survey photograph)", "serial": "RBK-TRD-2023-0188 (provisional; confirm from nameplate)", "asset": "M2B1PHF1L6TRD0017", "lab": "Physiology Laboratory", "installed": "10/09/2023", "warranty": "09/09/2025 (expired)", "status": "In service", "desc": "A motor drives a continuous belt over a cushioned deck at a speed set on the console, and the deck angle is adjustable to impose a gradient. The console reports elapsed time, speed, distance, incline and an estimate of energy expenditure, while handgrip sensors give a pulse reading. A safety key clipped to the subject cuts the motor the instant it is pulled free.", "use": "Graded exercise in physiology practicals: measurement of heart rate, blood pressure and respiratory response to a controlled workload, demonstration of recovery kinetics after exercise, and cardiovascular and exercise-physiology teaching sessions.", "specs": "Speed approximately 1 to 16 km/h; motorised incline; running surface approximately 1250 × 440 mm; console showing time, speed, distance, incline, energy estimate and pulse; handgrip pulse sensors; magnetic safety key cut-out; maximum user weight approximately 110 kg; 230 V, 50 Hz.", "hazards": "Falls are the main risk. Start the belt only with the subject standing astride the deck and holding the rails, and always clip the safety key to the subject’s clothing. Keep at least two metres clear behind the machine and allow no one to stand there. Loose clothing, laces and long hair can be drawn into the belt. Screen every subject for cardiac, respiratory or musculoskeletal problems before an exercise test, and stop at once on chest pain, dizziness or distress. Isolate the machine at the socket when not in use so that it cannot be started unsupervised.", "ppe": ["Sports shoes"]}];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = id => DATA.find(d => d.id.toLowerCase() === String(id).toLowerCase());

function rows(pairs){
  return '<dl>' + pairs.map(([k,v]) =>
    `<div class="row"><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('') + '</dl>';
}

function record(d){
  const ok = d.status === 'In service';
  return `
  <a class="back" href="#">&larr; All equipment</a>
  <div class="card">
    <div class="sec">Laboratory equipment record &nbsp;&middot;&nbsp; ${esc(d.id)}</div>
    <div class="hero">
      <img src="img/${esc(d.id)}.jpg" alt="${esc(d.name)}" loading="lazy">
      <div class="meta">
        <h2>${esc(d.name)}</h2>
        <div class="mdl">${esc(d.model)}</div>
        <div class="asset"><b>ASSET No.</b><code>${esc(d.asset)}</code></div><br>
        <span class="pill${ok ? '' : ' warn'}">${esc(d.status)}</span>
      </div>
    </div>
    ${rows([
      ['Serial No.', esc(d.serial)],
      ['Installation date', esc(d.installed)],
      ['Warranty expiry', esc(d.warranty)],
    ])}
    <div class="sec">Description</div>
    <div class="block"><h3>Description &amp; working principle</h3><p>${esc(d.desc)}</p></div>
    <div class="block"><h3>Intended use / applications</h3><p>${esc(d.use)}</p></div>
    <div class="block"><h3>Key specifications</h3><p>${esc(d.specs)}</p></div>
    <div class="sec">Operation &amp; safety</div>
    <div class="block"><h3>Hazards &amp; precautions</h3><p>${esc(d.hazards)}</p></div>
    <div class="block"><h3>Required PPE</h3>
      <div class="ppe">${d.ppe.map(p => `<span>${esc(p)}</span>`).join('')}</div></div>
  </div>
  <footer>Form No. COP-EQ-01 &nbsp;Rev. 1 &nbsp;&middot;&nbsp; Equipment record ${esc(d.id)}<br>
    College of Pharmacy, Al-Maaqal University</footer>`;
}

function index(){
  return `
  <p class="lead">${DATA.length} instruments on the teaching-laboratory register.
   Scan the QR label on an instrument to open its record directly.</p>
  <input class="search" id="q" type="search" placeholder="Search by name, model or asset number"
    autocomplete="off" aria-label="Search equipment">
  <ul class="list" id="list"></ul>
  <footer>Form No. COP-EQ-01 &nbsp;Rev. 1<br>College of Pharmacy, Al-Maaqal University</footer>`;
}

function paint(filter){
  const f = (filter || '').toLowerCase().trim();
  const hits = DATA.filter(d => !f ||
    (d.name + ' ' + d.model + ' ' + d.asset + ' ' + d.lab + ' ' + d.id).toLowerCase().includes(f));
  document.getElementById('list').innerHTML = hits.length
    ? hits.map(d => `<li><a href="#${d.id.toLowerCase()}">
        <img src="img/${d.id}.jpg" alt="" loading="lazy">
        <div><div class="t">${esc(d.short)}</div><div class="s">${esc(d.asset)}</div></div></a></li>`).join('')
    : '<li style="color:#6B7785;font-size:14px">No match.</li>';
}

function route(){
  const key = decodeURIComponent(location.hash.replace(/^#/, ''));
  const d = key && byId(key);
  const root = document.getElementById('app');
  if (d){ root.innerHTML = record(d); document.title = d.short + ' · ' + d.id; }
  else {
    root.innerHTML = index();
    document.title = 'Laboratory Equipment Register · College of Pharmacy, Al-Maaqal University';
    paint('');
    const q = document.getElementById('q');
    q.addEventListener('input', () => paint(q.value));
  }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
